<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Регистрация — Dragon VPN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/styles.css">
<link rel="icon" type="image/png" href="/icon-dark-32x32.png">
<link rel="apple-touch-icon" href="/apple-icon.png">
</head>
<body>

<div class="orb orb-1"></div>
<div class="orb orb-2"></div>

<!-- NAV -->
<nav>
  <div class="nav-inner">
    <a href="/index.html" class="logo">
      <span class="logo-text">Dragon<span>VPN</span></span>
    </a>
    <div class="nav-actions">
      <a href="/index.html" class="nav-link">На главную</a>
      <a href="/login.html" class="nav-buy">Войти</a>
    </div>
    <button class="nav-burger" id="nav-burger" type="button" aria-label="Открыть меню" aria-expanded="false" aria-controls="nav-mobile-menu">
      <span></span><span></span><span></span>
    </button>
  </div>
  <div class="nav-mobile-menu" id="nav-mobile-menu">
    <a href="/index.html" class="nav-mobile-link">На главную</a>
    <a href="/login.html" class="nav-mobile-buy">Войти</a>
    <div class="nav-mobile-divider"></div>
    <a href="https://t.me/DragonPNBot" class="nav-mobile-link">Политика</a>
    <a href="https://t.me/DragonPNBot" class="nav-mobile-link">Условия</a>
    <a href="https://t.me/DragonVPNSupport" class="nav-mobile-link">Поддержка</a>
  </div>
</nav>

<main class="auth-page">
  <div class="auth-card">
    <a href="/index.html" class="auth-logo">
      <img src="/img/dragon-logo.png" alt="" class="logo-mark" width="128" height="128" decoding="async">
      Dragon<span>VPN</span>
    </a>
    <h1 class="auth-title">Регистрация</h1>
    <p class="auth-sub">Укажите номер телефона и пароль для доступа к кабинету.</p>

    <div class="auth-alert" id="form-alert" role="alert"></div>

    <form id="register-form" novalidate>
      <div class="field">
        <label for="phone">Телефон</label>
        <input class="input" type="tel" id="phone" name="phone" placeholder="+7 900 123-45-67" autocomplete="tel" inputmode="tel" required>
        <p class="field-error" data-error-for="phone"></p>
      </div>

      <div class="field">
        <label for="password">Пароль</label>
        <input class="input" type="password" id="password" name="password" placeholder="Минимум 8 символов" autocomplete="new-password" required>
        <p class="field-error" data-error-for="password"></p>
      </div>

      <div class="field">
        <label for="confirm">Повторите пароль</label>
        <input class="input" type="password" id="confirm" name="confirm" placeholder="••••••••" autocomplete="new-password" required>
        <p class="field-error" data-error-for="confirm"></p>
      </div>

      <button type="submit" class="btn-red btn-block" id="submit-btn">
        <span class="btn-label">Зарегистрироваться</span>
      </button>
    </form>

    <p class="auth-foot">Уже есть аккаунт? <a href="/login.html">Войдите в него</a>.</p>
  </div>
</main>

<script src="/js/nav.js"></script>
<script src="/js/auth.js"></script>
</body>
</html>

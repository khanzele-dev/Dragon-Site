services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: dragonvpn
      POSTGRES_PASSWORD: dragonvpn
      POSTGRES_DB: dragonvpn
    ports:
      - "5433:5432"
    volumes:
      - dragonvpn_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dragonvpn"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  dragonvpn_pgdata:
